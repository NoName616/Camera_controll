[package]
name = "camera_connect"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.28"
eframe = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }
winapi = { version = "0.3.9", features = ["winuser", "windef", "libloaderapi", "processthreadsapi", "handleapi"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
lazy_static = "1.4.0"
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"